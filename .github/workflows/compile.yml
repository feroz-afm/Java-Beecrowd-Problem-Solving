name: Compile Java solutions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile every Main.java
        run: |
          status=0
          for f in $(find . -name Main.java | sort); do
            out=$(mktemp -d)
            if javac -d "$out" "$f"; then echo "OK   $f"; else echo "FAIL $f"; status=1; fi
          done
          exit $status
